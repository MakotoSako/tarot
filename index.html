        upright: { keywords: "実直・忍耐・確実な歩み・責任感・信頼性", detail: "重い軍馬に乗って歩みを止めず、着実に前進する最も信頼できる騎士。時間はかかっても必ずやり遂げます。", advice: "近道を探さず、地道で確実な方法を選んで一歩ずつゴールへ進みましょう。" },
        reversed: { keywords: "頑固・鈍重・融通が利かない・停滞", detail: "慎重になりすぎて全く前進しなかったり、頑固に前例に固執して周囲を苛立たせる暗示です。柔軟性を。", advice: "慎重さと怠慢を取り違えないよう、少しスピードアップを意識してください。" },
        yesno: "YES（着実にやり遂げる）"
      },
      {
        id: "p_13", file: "p13.jpg", type: "minor", suit: "pentacles", suitName: "ペンタクル", num: "Queen", name: "ペンタクルのクイーン",
        upright: { keywords: "慈愛・家庭的な温もり・現実的知恵・繁栄", detail: "豊かな大地でコインを優しく抱く母性あふれる女王。生活を豊かに整え、周囲を温かく育む現実的な知恵があります。", advice: "身近な生活環境を心地よく整え、現実的な温かさで周囲をサポートしましょう。" },
        reversed: { keywords: "過度の心配性・物質への執着・疑心暗鬼・過保護", detail: "お金や健康の不安に囚われてケチケチしたり、身内を過剰に縛り付けてしまうサインです。心を大きく。", advice: "お金や物の心配ばかりせず、豊かな心で人を信じるゆとりを持ちましょう。" },
        yesno: "YES（温かい実り）"
      },
      {
        id: "p_14", file: "p14.jpg", type: "minor", suit: "pentacles", suitName: "ペンタクル", num: "King", name: "ペンタクルのキング",
        upright: { keywords: "実業界の覇者・確固たる富・成功・頼もしさ", detail: "豊かな葡萄と牛の彫刻に囲まれた王座に座る成功者。ビジネスと資産を完璧に管理し、盤石の繁栄を築きます。", advice: "確かな手腕と責任感を発揮し、現実的な成果をしっかり手中に収めましょう。" },
        reversed: { keywords: "強欲・拝金主義・頑迷・金銭的トラブル", detail: "すべてをお金や損得だけで判断し、人情を失っている暗示です。富に執着しすぎて足元をすくわれないよう自戒を。", advice: "損得勘定を一旦手放し、人間関係の温かさや誠実さを最優先にしてください。" },
        yesno: "YES（物質的成功）"
      }
    ];

    /* ========================================================
       状態管理
       ======================================================== */
    let currentDeckFilter = 'full'; // 'full' | 'major' | 'minor'
    let currentSpreadMode = 'one';  // 'one' | 'three' | 'relation' | 'celtic' | 'yesno'
    let lastDrawnResults = [];

    function setDeckFilter(filter, btn) {
      currentDeckFilter = filter;
      btn.parentElement.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    function setSpreadMode(mode, btn) {
      currentSpreadMode = mode;
      btn.parentElement.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    /* ========================================================
       カード展開ロジック
       ======================================================== */
    function performDraw() {
      const area = document.getElementById('displayArea');
      area.innerHTML = '';
      lastDrawnResults = [];

      // デッキの絞り込み
      let pool = [...tarotDeck];
      if (currentDeckFilter === 'major') {
        pool = pool.filter(c => c.type === 'major');
      } else if (currentDeckFilter === 'minor') {
        pool = pool.filter(c => c.type === 'minor');
      }

      // シャッフル
      const shuffled = [...pool].sort(() => Math.random() - 0.5);

      if (currentSpreadMode === 'one') {
        renderCard(area, shuffled[0], "今の託宣");
      } else if (currentSpreadMode === 'three') {
        renderCard(area, shuffled[0], "1. 過去 / これまで");
        renderCard(area, shuffled[1], "2. 現在 / 直面する課題");
        renderCard(area, shuffled[2], "3. 近い未来 / 展望");
      } else if (currentSpreadMode === 'relation') {
        renderCard(area, shuffled[0], "1. お相手の現状・余裕");
        renderCard(area, shuffled[1], "2. あなたへの本音・印象");
        renderCard(area, shuffled[2], "3. 課題やすれ違いの原因");
        renderCard(area, shuffled[3], "4. あなたからの接し方");
      } else if (currentSpreadMode === 'celtic') {
        renderCard(area, shuffled[0], "1. 現状 (要)");
        renderCard(area, shuffled[1], "2. 試練 / 障害");
        renderCard(area, shuffled[2], "3. 潜在意識 / 根底");
        renderCard(area, shuffled[3], "4. 過去 / 背景");
        renderCard(area, shuffled[4], "5. 顕在意識 / 目標");
        renderCard(area, shuffled[5], "6. 近い未来");
        renderCard(area, shuffled[6], "7. 本人の立場・姿勢");
        renderCard(area, shuffled[7], "8. 周囲の環境・他者");
        renderCard(area, shuffled[8], "9. 希望と不安");
        renderCard(area, shuffled[9], "10. 最終結果");
      } else if (currentSpreadMode === 'yesno') {
        renderCard(area, shuffled[0], "Yes / No 託宣", true);
      }

      updateOverallPanel();
      if (window.lucide) lucide.createIcons();
    }

    function renderCard(container, cardData, slotTitle, isYesNo = false) {
      const isReversed = Math.random() < 0.45; // 45%で逆位置
      const detailData = isReversed ? cardData.reversed : cardData.upright;

      lastDrawnResults.push({
        slot: slotTitle,
        card: cardData,
        isReversed: isReversed,
        isYesNo: isYesNo
      });

      const slot = document.createElement('div');
      slot.className = 'card-slot';

      let yesnoHtml = '';
      if (isYesNo) {
        let badgeClass = 'badge-maybe';
        if (cardData.yesno.startsWith('YES')) badgeClass = 'badge-yes';
        if (cardData.yesno.startsWith('NO')) badgeClass = 'badge-no';
        yesnoHtml = `<div class="yesno-badge ${badgeClass}">${cardData.yesno}</div>`;
      }

      // 画像エラー時は「bh.jpg」またはフォールバック表示
      const fileName = cardData.file;

      slot.innerHTML = `
        <div class="slot-label">${slotTitle}</div>
        <div class="card-frame">
          <img src="${fileName}" 
               alt="${cardData.name}" 
               class="${isReversed ? 'reversed' : ''}"
               onerror="this.onerror=null; this.src='bh.jpg'; this.onerror=function(){ this.parentElement.innerHTML='<div class=\\'card-back-fallback\\'>✦<br><b style=\\'font-size:13px;margin-top:6px;\\'>${cardData.name}</b><span style=\\'font-size:10px;color:#a49cb2;margin-top:4px;\\'>(${fileName})</span></div>'; };">
        </div>
        <div class="card-details">
          ${yesnoHtml}
          <div class="card-title font-cinzel">
            <span class="card-suit-tag">${cardData.suitName}</span>
            <span>${cardData.num}. ${cardData.name}</span>
          </div>
          <div class="card-position ${isReversed ? 'position-reversed' : 'position-upright'}">
            ${isReversed ? '逆位置 (Reversed)' : '正位置 (Upright)'}
          </div>
          <div class="card-desc">
            <div class="desc-keywords">✦ ${detailData.keywords}</div>
            <div class="desc-body">${detailData.detail}</div>
            <div class="desc-advice"><b>助言:</b> ${detailData.advice}</div>
          </div>
        </div>
      `;

      container.appendChild(slot);
    }

    /* ========================================================
       総括メッセージ生成
       ======================================================== */
    function updateOverallPanel() {
      const panel = document.getElementById('overallPanel');
      const textEl = document.getElementById('overallText');
      const qInput = document.getElementById('userQuestion');
      const question = qInput ? qInput.value.trim() : '';

      if (!panel || !textEl || lastDrawnResults.length === 0) return;

      let msg = '';
      if (question) {
        msg += `【ご質問: 「${question}」】\n\n`;
      }

      if (currentSpreadMode === 'one') {
        const item = lastDrawnResults[0];
        const data = item.isReversed ? item.card.reversed : item.card.upright;
        msg += `現れたカードは『${item.card.name}（${item.isReversed ? '逆位置' : '正位置'}）』です。\n`
             + `鍵となるエネルギー:「${data.keywords}」\n\n`
             + `${data.detail}\n\n`
             + `【運命の行動指針】\n${data.advice}`;
      } else if (currentSpreadMode === 'three') {
        const [c1, c2, c3] = lastDrawnResults;
        const d1 = c1.isReversed ? c1.card.reversed : c1.card.upright;
        const d2 = c2.isReversed ? c2.card.reversed : c2.card.upright;
        const d3 = c3.isReversed ? c3.card.reversed : c3.card.upright;
        msg += `【過去の経緯】『${c1.card.name} (${c1.isReversed ? '逆' : '正'})』: ${d1.detail}\n\n`
             + `【現在の状況】『${c2.card.name} (${c2.isReversed ? '逆' : '正'})』: ${d2.detail}\n\n`
             + `【近未来と助言】『${c3.card.name} (${c3.isReversed ? '逆' : '正'})』: ${d3.detail}\n`
             + `✦ アドバイス: ${d3.advice}`;
      } else if (currentSpreadMode === 'relation') {
        const [p1, p2, p3, p4] = lastDrawnResults;
        const d1 = p1.isReversed ? p1.card.reversed : p1.card.upright;
        const d2 = p2.isReversed ? p2.card.reversed : p2.card.upright;
        const d3 = p3.isReversed ? p3.card.reversed : p3.card.upright;
        const d4 = p4.isReversed ? p4.card.reversed : p4.card.upright;
        msg += `1. お相手の現状: 『${p1.card.name}』- ${d1.detail}\n\n`
             + `2. あなたへの本音: 『${p2.card.name}』- ${d2.detail}\n\n`
             + `3. 課題やすれ違い: 『${p3.card.name}』- ${d3.detail}\n\n`
             + `4. あなたからの接し方: 『${p4.card.name}』- ${d4.advice}`;
      } else if (currentSpreadMode === 'celtic') {
        const key = lastDrawnResults[0];
        const obstacle = lastDrawnResults[1];
        const outcome = lastDrawnResults[9];
        const dKey = key.isReversed ? key.card.reversed : key.card.upright;
        const dObs = obstacle.isReversed ? obstacle.card.reversed : obstacle.card.upright;
        const dOut = outcome.isReversed ? outcome.card.reversed : outcome.card.upright;
        msg += `【ケルト十字 核心のメッセージ】\n`
             + `現状の中心には『${key.card.name} (${key.isReversed ? '逆位置' : '正位置'})』が位置し、「${dKey.keywords}」が今最も強く働いています。\n`
             + `直面している試練は『${obstacle.card.name}』(${dObs.keywords}) ですが、\n`
             + `最終結果には『${outcome.card.name} (${outcome.isReversed ? '逆位置' : '正位置'})』が現れました。\n\n`
             + `✦ 最終展望: ${dOut.detail}\n`
             + `✦ 克服への助言: ${dOut.advice}`;
      } else if (currentSpreadMode === 'yesno') {
        const item = lastDrawnResults[0];
        const data = item.isReversed ? item.card.reversed : item.card.upright;
        msg += `託宣の判定: 【${item.card.yesno}】\n\n`
             + `カード『${item.card.name}（${item.isReversed ? '逆位置' : '正位置'}）』からのメッセージ:\n`
             + `${data.detail}\n\n`
             + `助言: ${data.advice}`;
      }

      textEl.textContent = msg;
      panel.style.display = 'block';
    }

    /* ========================================================
       クリップボードコピー
       ======================================================== */
    function copyResult() {
      if (lastDrawnResults.length === 0) return;
      const qInput = document.getElementById('userQuestion');
      const question = qInput ? qInput.value.trim() : '';

      let text = `✦ タロット託宣結果 ✦\n`;
      if (question) text += `問い: ${question}\n`;
      text += `デッキ: ${currentDeckFilter === 'full' ? '78枚フルデッキ' : currentDeckFilter === 'major' ? '大アルカナ' : '小アルカナ'}\n\n`;

      lastDrawnResults.forEach(r => {
        const data = r.isReversed ? r.card.reversed : r.card.upright;
        text += `【${r.slot}】${r.card.suitName} ${r.card.num}. ${r.card.name} (${r.isReversed ? '逆位置' : '正位置'})\n`;
        if (r.isYesNo) text += `判定: ${r.card.yesno}\n`;
        text += `象徴: ${data.keywords}\n`;
        text += `解釈: ${data.detail}\n`;
        text += `助言: ${data.advice}\n\n`;
      });

      const overall = document.getElementById('overallText').textContent;
      if (overall) {
        text += `【運命の総括アドバイス】\n${overall}\n`;
      }

      const tempArea = document.createElement('textarea');
      tempArea.value = text;
      document.body.appendChild(tempArea);
      tempArea.select();
      try {
        document.execCommand('copy');
        const toast = document.getElementById('copyToast');
        if (toast) {
          toast.style.display = 'inline';
          setTimeout(() => { toast.style.display = 'none'; }, 2500);
        }
      } catch (e) {
        console.error(e);
      }
      document.body.removeChild(tempArea);
    }

    window.addEventListener('load', () => {
      if (window.lucide) lucide.createIcons();
    });
  </script>
</body>
</html>
