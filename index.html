<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>タロット占い - 78枚フルデッキ神秘の託宣</title>
  <!-- Google Fonts: Cinzel & Noto Serif JP -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Noto+Serif+JP:wght@400;600;700&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at 50% 15%, #1d172c 0%, #0a0812 100%);
      color: #e4dcd0;
      font-family: 'Noto Serif JP', -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Meiryo", serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 12px 48px;
    }

    .font-cinzel {
      font-family: 'Cinzel', serif;
    }

    header {
      text-align: center;
      margin-bottom: 16px;
      width: 100%;
    }

    h1 {
      color: #dfb76c;
      font-size: clamp(20px, 6vw, 28px);
      letter-spacing: 2.5px;
      margin-bottom: 4px;
      text-shadow: 0 0 16px rgba(223, 183, 108, 0.45);
    }

    p.subtitle {
      font-size: clamp(11px, 3.2vw, 13px);
      color: #a59cb6;
      letter-spacing: 0.8px;
    }

    /* コントロール群 */
    .controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      width: 100%;
      max-width: 820px;
    }

    /* セレクターグループ */
    .selector-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      width: 100%;
    }

    .selector-label {
      font-size: 11px;
      color: #dfb76c;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      font-weight: 600;
    }

    .btn-group {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 5px;
      background: rgba(255, 255, 255, 0.04);
      padding: 4px;
      border-radius: 12px;
      border: 1px solid rgba(223, 183, 108, 0.22);
      backdrop-filter: blur(8px);
      width: 100%;
      max-width: 620px;
    }

    .nav-btn {
      background: transparent;
      border: 1px solid transparent;
      color: #bfb8cc;
      padding: 8px 12px;
      min-height: 40px;
      font-size: 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 1 1 auto;
    }

    .nav-btn:hover {
      color: #ffffff;
      border-color: rgba(223, 183, 108, 0.4);
    }

    .nav-btn.active {
      background: #dfb76c;
      color: #120e1a;
      font-weight: 700;
      border-color: #ffe29a;
      box-shadow: 0 2px 10px rgba(223, 183, 108, 0.35);
    }

    /* 質問入力 */
    .question-box {
      width: 100%;
      max-width: 520px;
      display: flex;
      align-items: center;
      background: rgba(14, 11, 24, 0.85);
      border: 1px solid rgba(223, 183, 108, 0.3);
      border-radius: 24px;
      padding: 4px 14px;
      min-height: 46px;
      transition: border-color 0.2s;
    }
    .question-box:focus-within {
      border-color: #dfb76c;
      box-shadow: 0 0 12px rgba(223, 183, 108, 0.25);
    }
    .question-box input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: #f6f1e5;
      font-size: 13px;
      padding: 6px 4px;
      font-family: inherit;
    }
    .question-box input::placeholder {
      color: #726884;
    }

    /* 展開ボタン */
    .draw-btn {
      background: linear-gradient(135deg, #f2cd80, #a98337);
      color: #0b0910;
      border: 1px solid #ffe9b5;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 1.5px;
      padding: 13px 36px;
      min-height: 48px;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 18px rgba(223, 183, 108, 0.35);
      transition: transform 0.1s ease, filter 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: inherit;
      width: 100%;
      max-width: 320px;
      margin-top: 4px;
    }

    .draw-btn:hover {
      filter: brightness(1.1);
    }

    .draw-btn:active {
      transform: scale(0.97);
    }

    /* 表示切り替え（スワイプ/グリッド）バー */
    .mobile-view-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 1200px;
      margin-bottom: 12px;
      padding: 0 4px;
    }

    .view-toggle-btns {
      display: flex;
      gap: 4px;
      background: rgba(255, 255, 255, 0.05);
      padding: 2px;
      border-radius: 8px;
      border: 1px solid rgba(223, 183, 108, 0.2);
    }

    .view-btn {
      background: transparent;
      border: none;
      color: #a59cb6;
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
    }

    .view-btn.active {
      background: rgba(223, 183, 108, 0.25);
      color: #dfb76c;
      font-weight: 700;
    }

    .card-count-indicator {
      font-size: 11px;
      color: #a59cb6;
      letter-spacing: 0.5px;
    }

    /* カード表示エリア */
    .cards-wrapper {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 16px;
      width: 100%;
      max-width: 1200px;
      margin-bottom: 28px;
      transition: all 0.3s ease;
    }

    /* モバイルのスワイプモード時 */
    .cards-wrapper.swipe-mode {
      flex-wrap: nowrap;
      justify-content: flex-start;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      padding-bottom: 14px;
      padding-left: 8px;
      padding-right: 8px;
      -webkit-overflow-scrolling: touch;
      gap: 14px;
    }

    .cards-wrapper.swipe-mode .card-slot {
      scroll-snap-align: center;
      flex-shrink: 0;
    }

    /* カードスロット */
    .card-slot {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: clamp(140px, 44vw, 210px);
      animation: fadeInSlot 0.45s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes fadeInSlot {
      from { opacity: 0; transform: translateY(12px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .slot-label {
      font-size: 11px;
      font-weight: 700;
      color: #dfb76c;
      margin-bottom: 6px;
      letter-spacing: 0.8px;
      text-align: center;
      min-height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      word-break: break-all;
    }

    /* 3Dカードフリップコンテナ */
    .card-flip-container {
      perspective: 1000px;
      width: 100%;
      aspect-ratio: 1 / 1.59;
      border-radius: 10px;
    }

    .card-flipper {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 0.65s cubic-bezier(0.2, 0.85, 0.32, 1.2);
    }

    .card-flipper.flipped {
      transform: rotateY(180deg);
    }

    .card-front, .card-back-side {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 10px;
      overflow: hidden;
      border: 1.5px solid #dfb76c;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.7), 0 0 12px rgba(223, 183, 108, 0.12);
      background: #171322;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-back-side {
      z-index: 2;
      transform: rotateY(0deg);
    }

    .card-front {
      transform: rotateY(180deg);
    }

    .card-front img, .card-back-side img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.3s ease;
    }

    .card-front img.reversed {
      transform: rotate(180deg);
    }

    .card-back-fallback {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #dfb76c;
      font-size: 28px;
      border: 2px dashed rgba(223, 183, 108, 0.3);
      background: radial-gradient(circle, #27213b 0%, #100e18 100%);
    }

    /* カード詳細解説 */
    .card-details {
      margin-top: 8px;
      text-align: center;
      width: 100%;
    }

    .card-title {
      font-size: 13px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 4px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .card-suit-tag {
      font-size: 9px;
      padding: 1px 5px;
      border-radius: 4px;
      background: rgba(223, 183, 108, 0.15);
      color: #dfb76c;
      border: 1px solid rgba(223, 183, 108, 0.3);
    }

    .card-position {
      display: inline-block;
      font-size: 10px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 12px;
      margin-bottom: 6px;
    }

    .position-upright {
      background: rgba(80, 200, 120, 0.18);
      color: #72eca0;
      border: 1px solid rgba(80, 200, 120, 0.45);
    }

    .position-reversed {
      background: rgba(230, 80, 80, 0.18);
      color: #ff9393;
      border: 1px solid rgba(230, 80, 80, 0.45);
    }

    .card-desc {
      font-size: 11px;
      color: #c9bfd0;
      line-height: 1.55;
      text-align: left;
      background: rgba(0, 0, 0, 0.52);
      padding: 8px 10px;
      border-radius: 8px;
      border-left: 3px solid #dfb76c;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .desc-keywords {
      font-size: 10px;
      color: #dfb76c;
      font-weight: 600;
      border-bottom: 1px dashed rgba(223, 183, 108, 0.25);
      padding-bottom: 3px;
    }

    .desc-body {
      color: #e5dfed;
    }

    .desc-advice {
      font-size: 10px;
      color: #ffe6a4;
      background: rgba(223, 183, 108, 0.08);
      padding: 4px 6px;
      border-radius: 4px;
      line-height: 1.4;
    }

    /* Yes/No バッジ */
    .yesno-badge {
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .badge-yes { color: #5ce691; }
    .badge-no { color: #ff6b6b; }
    .badge-maybe { color: #ffd166; }

    /* 総括・コピーパネル */
    .overall-panel {
      width: 100%;
      max-width: 820px;
      background: rgba(20, 17, 30, 0.88);
      border: 1px solid rgba(223, 183, 108, 0.35);
      border-radius: 14px;
      padding: 16px;
      display: none;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .overall-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      border-bottom: 1px solid rgba(223, 183, 108, 0.2);
      padding-bottom: 6px;
    }

    .overall-title {
      font-size: 13px;
      font-weight: 700;
      color: #dfb76c;
      letter-spacing: 0.8px;
    }

    .copy-btn {
      background: rgba(223, 183, 108, 0.15);
      border: 1px solid rgba(223, 183, 108, 0.4);
      color: #dfb76c;
      font-size: 11px;
      padding: 6px 12px;
      min-height: 32px;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .copy-btn:hover {
      background: rgba(223, 183, 108, 0.3);
      color: #ffffff;
    }

    .overall-body {
      font-size: 12px;
      line-height: 1.65;
      color: #d8cfe0;
      white-space: pre-line;
    }

    .copy-toast {
      font-size: 11px;
      color: #5ce691;
      margin-right: 8px;
      display: none;
    }

    footer {
      margin-top: auto;
      font-size: 11px;
      color: #736982;
      text-align: center;
      padding-top: 24px;
    }

    @media (max-width: 600px) {
      .card-slot {
        width: clamp(140px, 45vw, 190px);
      }
      .btn-group {
        width: 100%;
      }
      .nav-btn {
        font-size: 11px;
        padding: 8px 6px;
      }
    }
  </style>
</head>

  <footer>

    /* ========================================================
       状態管理
       ======================================================== */
    let currentDeckFilter = 'full'; // 'full' | 'major' | 'minor'
    let currentSpreadMode = 'one';  // 'one' | 'three' | 'relation' | 'celtic' | 'yesno'
    let lastDrawnResults = [];
    let currentDisplayMode = 'grid'; // 'grid' | 'swipe'

    function setDeckFilter(filter, btn) {
      currentDeckFilter = filter;
      btn.parentElement.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    function setSpreadMode(mode, btn) {
      currentSpreadMode = mode;
      btn.parentElement.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    function toggleDisplayMode(mode) {
      currentDisplayMode = mode;
      const area = document.getElementById('displayArea');
      const btnGrid = document.getElementById('btnGrid');
      const btnSwipe = document.getElementById('btnSwipe');

      if (mode === 'swipe') {
        area.classList.add('swipe-mode');
        btnSwipe.classList.add('active');
        btnGrid.classList.remove('active');
      } else {
        area.classList.remove('swipe-mode');
        btnGrid.classList.add('active');
        btnSwipe.classList.remove('active');
      }
    }

    /* ========================================================
       カード展開ロジック
       ======================================================== */
    function performDraw() {
      const area = document.getElementById('displayArea');
      const viewBar = document.getElementById('viewBar');
      const cardCountIndicator = document.getElementById('cardCountIndicator');
      area.innerHTML = '';
      lastDrawnResults = [];

      // デッキの絞り込み
      let pool = [...tarotDeck];
      if (currentDeckFilter === 'major') {
        pool = pool.filter(c => c.type === 'major');
      } else if (currentDeckFilter === 'minor') {
        pool = pool.filter(c => c.type === 'minor');
      }

      // シャッフル
      const shuffled = [...pool].sort(() => Math.random() - 0.5);

      const spreadMap = {
        one: [{ title: "今の託宣", isYesNo: false }],
        three: [
          { title: "1. 過去 / これまで", isYesNo: false },
          { title: "2. 現在 / 直面する課題", isYesNo: false },
          { title: "3. 近い未来 / 展望", isYesNo: false }
        ],
        relation: [
          { title: "1. お相手の現状・余裕", isYesNo: false },
          { title: "2. あなたへの本音・印象", isYesNo: false },
          { title: "3. 課題やすれ違いの原因", isYesNo: false },
          { title: "4. あなたからの接し方", isYesNo: false }
        ],
        celtic: [
          { title: "1. 現状 (要)", isYesNo: false },
          { title: "2. 試練 / 障害", isYesNo: false },
          { title: "3. 潜在意識 / 根底", isYesNo: false },
          { title: "4. 過去 / 背景", isYesNo: false },
          { title: "5. 顕在意識 / 目標", isYesNo: false },
          { title: "6. 近い未来", isYesNo: false },
          { title: "7. 本人の立場・姿勢", isYesNo: false },
          { title: "8. 周囲の環境・他者", isYesNo: false },
          { title: "9. 希望と不安", isYesNo: false },
          { title: "10. 最終結果", isYesNo: false }
        ],
        yesno: [{ title: "Yes / No 託宣", isYesNo: true }]
      };

      const selectedSpread = spreadMap[currentSpreadMode];

      // 複数枚の場合はビュー切替バーを表示
      if (selectedSpread.length > 1) {
        viewBar.style.display = 'flex';
        cardCountIndicator.textContent = `${selectedSpread.length} 枚展開`;
        if (window.innerWidth < 640 && selectedSpread.length >= 4) {
          toggleDisplayMode('swipe');
        } else {
          toggleDisplayMode('grid');
        }
      } else {
        viewBar.style.display = 'none';
        toggleDisplayMode('grid');
      }

      selectedSpread.forEach((slotInfo, index) => {
        renderCard(area, shuffled[index], slotInfo.title, slotInfo.isYesNo, index);
      });

      updateOverallPanel();
      if (window.lucide) lucide.createIcons();

      setTimeout(() => {
        area.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }, 100);
    }

    function renderCard(container, cardData, slotTitle, isYesNo = false, delayIndex = 0) {
      const isReversed = Math.random() < 0.45;
      const detailData = isReversed ? cardData.reversed : cardData.upright;

      lastDrawnResults.push({
        slot: slotTitle,
        card: cardData,
        isReversed: isReversed,
        isYesNo: isYesNo
      });

      const slot = document.createElement('div');
      slot.className = 'card-slot';

      let yesnoHtml = '';
      if (isYesNo) {
        let badgeClass = 'badge-maybe';
        if (cardData.yesno.startsWith('YES')) badgeClass = 'badge-yes';
        if (cardData.yesno.startsWith('NO')) badgeClass = 'badge-no';
        yesnoHtml = `<div class="yesno-badge ${badgeClass}">${cardData.yesno}</div>`;
      }

      const fileName = cardData.file;

      slot.innerHTML = `
        <div class="slot-label">${slotTitle}</div>
        <div class="card-flip-container">
          <div class="card-flipper" id="flipper-${delayIndex}">
            <!-- 裏面（初期） -->
            <div class="card-back-side">
              <img src="bh.jpg" alt="Card Back" onerror="this.onerror=null; this.parentElement.innerHTML='<div class=\\'card-back-fallback\\'>✦<br><span style=\\'font-size:10px;color:#a49cb2;margin-top:4px;\\'>TAROT</span></div>';">
            </div>
            <!-- 表面（めくられた後） -->
            <div class="card-front">
              <img src="${fileName}" 
                   alt="${cardData.name}" 
                   class="${isReversed ? 'reversed' : ''}"
                   onerror="this.onerror=null; this.src='bh.jpg'; this.onerror=function(){ this.parentElement.innerHTML='<div class=\\'card-back-fallback\\'>✦<br><b style=\\'font-size:12px;margin-top:4px;\\'>${cardData.name}</b><span style=\\'font-size:9px;color:#a49cb2;\\'>(${fileName})</span></div>'; };">
            </div>
          </div>
        </div>
        <div class="card-details">
          ${yesnoHtml}
          <div class="card-title font-cinzel">
            <span class="card-suit-tag">${cardData.suitName}</span>
            <span>${cardData.num}. ${cardData.name}</span>
          </div>
          <div class="card-position ${isReversed ? 'position-reversed' : 'position-upright'}">
            ${isReversed ? '逆位置 (Reversed)' : '正位置 (Upright)'}
          </div>
          <div class="card-desc">
            <div class="desc-keywords">✦ ${detailData.keywords}</div>
            <div class="desc-body">${detailData.detail}</div>
            <div class="desc-advice"><b>助言:</b> ${detailData.advice}</div>
          </div>
        </div>
      `;

      container.appendChild(slot);

      setTimeout(() => {
        const flipper = document.getElementById(`flipper-${delayIndex}`);
        if (flipper) flipper.classList.add('flipped');
      }, 120 + delayIndex * 150);
    }

    /* ========================================================
       総括メッセージ生成
       ======================================================== */
    function updateOverallPanel() {
      const panel = document.getElementById('overallPanel');
      const textEl = document.getElementById('overallText');
      const qInput = document.getElementById('userQuestion');
      const question = qInput ? qInput.value.trim() : '';

      if (!panel || !textEl || lastDrawnResults.length === 0) return;

      let msg = '';
      if (question) {
        msg += `【ご質問: 「${question}」】\n\n`;
      }

      if (currentSpreadMode === 'one') {
        const item = lastDrawnResults[0];
        const data = item.isReversed ? item.card.reversed : item.card.upright;
        msg += `現れたカードは『${item.card.name}（${item.isReversed ? '逆位置' : '正位置'}）』です。\n`
             + `鍵となるエネルギー:「${data.keywords}」\n\n`
             + `${data.detail}\n\n`
             + `【運命の行動指針】\n${data.advice}`;
      } else if (currentSpreadMode === 'three') {
        const [c1, c2, c3] = lastDrawnResults;
        const d1 = c1.isReversed ? c1.card.reversed : c1.card.upright;
        const d2 = c2.isReversed ? c2.card.reversed : c2.card.upright;
        const d3 = c3.isReversed ? c3.card.reversed : c3.card.upright;
        msg += `【過去の経緯】『${c1.card.name} (${c1.isReversed ? '逆' : '正'})』: ${d1.detail}\n\n`
             + `【現在の状況】『${c2.card.name} (${c2.isReversed ? '逆' : '正'})』: ${d2.detail}\n\n`
             + `【近未来と助言】『${c3.card.name} (${c3.isReversed ? '逆' : '正'})』: ${d3.detail}\n`
             + `✦ アドバイス: ${d3.advice}`;
      } else if (currentSpreadMode === 'relation') {
        const [p1, p2, p3, p4] = lastDrawnResults;
        const d1 = p1.isReversed ? p1.card.reversed : p1.card.upright;
        const d2 = p2.isReversed ? p2.card.reversed : p2.card.upright;
        const d3 = p3.isReversed ? p3.card.reversed : p3.card.upright;
        const d4 = p4.isReversed ? p4.card.reversed : p4.card.upright;
        msg += `1. お相手の現状: 『${p1.card.name}』- ${d1.detail}\n\n`
             + `2. あなたへの本音: 『${p2.card.name}』- ${d2.detail}\n\n`
             + `3. 課題やすれ違い: 『${p3.card.name}』- ${d3.detail}\n\n`
             + `4. あなたからの接し方: 『${p4.card.name}』- ${d4.advice}`;
      } else if (currentSpreadMode === 'celtic') {
        const key = lastDrawnResults[0];
        const obstacle = lastDrawnResults[1];
        const outcome = lastDrawnResults[9];
        const dKey = key.isReversed ? key.card.reversed : key.card.upright;
        const dObs = obstacle.isReversed ? obstacle.card.reversed : obstacle.card.upright;
        const dOut = outcome.isReversed ? outcome.card.reversed : outcome.card.upright;
        msg += `【ケルト十字 核心のメッセージ】\n`
             + `現状の中心には『${key.card.name} (${key.isReversed ? '逆位置' : '正位置'})』が位置し、「${dKey.keywords}」が今最も強く働いています。\n`
             + `直面している試練は『${obstacle.card.name}』(${dObs.keywords}) ですが、\n`
             + `最終結果には『${outcome.card.name} (${outcome.isReversed ? '逆位置' : '正位置'})』が現れました。\n\n`
             + `✦ 最終展望: ${dOut.detail}\n`
             + `✦ 克服への助言: ${dOut.advice}`;
      } else if (currentSpreadMode === 'yesno') {
        const item = lastDrawnResults[0];
        const data = item.isReversed ? item.card.reversed : item.card.upright;
        msg += `託宣の判定: 【${item.card.yesno}】\n\n`
             + `カード『${item.card.name}（${item.isReversed ? '逆位置' : '正位置'}）』からのメッセージ:\n`
             + `${data.detail}\n\n`
             + `助言: ${data.advice}`;
      }

      textEl.textContent = msg;
      panel.style.display = 'block';
    }

        const data = r.isReversed ? r.card.reversed : r.card.upright;
        text += `【${r.slot}】${r.card.suitName} ${r.card.num}. ${r.card.name} (${r.isReversed ? '逆位置' : '正位置'})\n`;
        if (r.isYesNo) text += `判定: ${r.card.yesno}\n`;
        text += `象徴: ${data.keywords}\n`;
        text += `解釈: ${data.detail}\n`;
        text += `助言: ${data.advice}\n\n`;
      });

      const overall = document.getElementById('overallText').textContent;
      if (overall) {
        text += `【運命の総括アドバイス】\n${overall}\n`;
      }

      const tempArea = document.createElement('textarea');
      tempArea.value = text;
      document.body.appendChild(tempArea);
      tempArea.select();
      try {
        document.execCommand('copy');
        const toast = document.getElementById('copyToast');
        if (toast) {
          toast.style.display = 'inline';
          setTimeout(() => { toast.style.display = 'none'; }, 2500);
        }
      } catch (e) {
        console.error(e);
      }
      document.body.removeChild(tempArea);
    }

    window.addEventListener('load', () => {
      if (window.lucide) lucide.createIcons();
    });
  </script>
</body>
</html>
